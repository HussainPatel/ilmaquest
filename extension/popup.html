<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ilmaQuest</title>
<style>
  body {
    width: 280px;
    font-family: system-ui, sans-serif;
    padding: 16px;
    color: #1c2621;
    background: #faf7f0;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #0f6d4c;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid #e4ddc9;
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #0f6d4c;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid #e4ddc9;
    color: #1c2621;
    margin-top: 6px;
  }
  p {
    font-size: 12px;
    color: #6b7268;
    margin: 8px 0;
  }
  a {
    color: #0f6d4c;
  }
  #status {
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <h1>ilmaQuest</h1>

  <div id="disconnected-view">
    <p>Paste the connection code from <a href="#" id="open-connect-link">ilmaQuest → your account</a>.</p>
    <input id="token-input" placeholder="iq_..." />
    <input id="apibase-input" placeholder="http://localhost:3000 (dev)" />
    <button id="connect-btn">Connect</button>
  </div>

  <div id="connected-view" style="display:none">
    <p>Connected ✓</p>
    <button id="check-now-btn">Check now</button>
    <button id="open-app-btn" class="secondary">Open ilmaQuest</button>
    <button id="disconnect-btn" class="secondary">Disconnect</button>
    <p id="status"></p>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
